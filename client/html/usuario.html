<div>
  <nav class="mt-navbar">
    <div class="d-flex align-items-center gap-2">
      <button class="btn-ghost btn-sm" onclick="history.back()" title="Atrás">
        <i class="fas fa-arrow-left"></i>
      </button>
      <a href="#!/home" class="mt-navbar-brand"><i class="fas fa-dove"></i> MiniTwitter</a>
    </div>
    <div class="nav-actions">
      <button class="btn-ghost btn-sm" ng-click="logout()" title="Cerrar sesión">
        <i class="fas fa-right-from-bracket"></i>
      </button>
    </div>
  </nav>

  <div class="mt-feed">
    <div class="profile-header">
      <div class="tuit-avatar avatar-large" ng-style="{background: username | avatarColor}">
        {{ username | initials }}
      </div>
      <div class="profile-username-text">@{{ username }}</div>
      <div class="text-muted mt-1" style="font-size:.82rem">
        {{ tuits.length }} tuit{{ tuits.length === 1 ? '' : 's' }}
      </div>
    </div>

    <div class="alert alert-danger" ng-show="errorMessage">{{ errorMessage }}</div>
    <div class="text-center py-5" ng-show="loading">
      <div class="spinner-border text-teal" role="status"></div>
    </div>
    <p class="text-center py-5" style="color:var(--text-muted)" ng-show="!loading && tuits.length === 0">
      Este usuario no tiene tuits aún.
    </p>

    <div class="tuit-card" ng-repeat="tuit in tuits">
      <div class="d-flex gap-3">
        <div class="tuit-avatar" ng-style="{background: tuit.username | avatarColor}">
          {{ tuit.username | initials }}
        </div>
        <div class="flex-grow-1 overflow-hidden">
          <div class="d-flex align-items-center gap-2 mb-1 flex-wrap">
            <span class="tuit-date">{{ tuit.fecha }}</span>
          </div>
          <div class="tuit-text clickable" ng-click="openTuit(tuit)">{{ tuit.texto }}</div>
          <div class="tuit-actions">
            <button class="btn-action btn-reply" ng-click="openTuit(tuit)" title="Responder">
              <i class="fas fa-reply"></i> <span>{{ tuit.num_respuestas }}</span>
            </button>
            <button class="btn-action btn-rt" ng-class="{active: tuit.retuiteado}" ng-click="toggleRetuit(tuit)">
              <i class="fas fa-retweet"></i> <span>{{ tuit.num_retuits }}</span>
            </button>
            <button class="btn-action btn-like" ng-class="{active: tuit.liked}" ng-click="toggleLike(tuit)">
              <i class="fas fa-heart"></i> <span>{{ tuit.num_likes }}</span>
            </button>
            <button class="btn-action btn-delete" ng-show="isOwn(tuit)" ng-click="deleteTuit(tuit)">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
