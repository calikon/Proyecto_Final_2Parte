<div>
  <nav class="mt-navbar">
    <div class="d-flex align-items-center gap-2">
      <button class="btn-ghost btn-sm" onclick="history.back()" title="Atrás">
        <i class="fas fa-arrow-left"></i>
      </button>
      <a href="#!/home" class="mt-navbar-brand"><i class="fas fa-dove"></i> MiniTwitter</a>
    </div>
    <div class="nav-actions">
      <button class="btn-ghost btn-sm" ng-click="logout()" title="Cerrar sesión">
        <i class="fas fa-right-from-bracket"></i>
      </button>
    </div>
  </nav>

  <div class="mt-feed">
    <div class="alert alert-danger" ng-show="errorMessage">{{ errorMessage }}</div>
    <div class="text-center py-5" ng-show="loading">
      <div class="spinner-border text-teal" role="status"></div>
    </div>

    <div class="tuit-card tuit-main" ng-if="!loading && tuit">
      <div class="d-flex gap-3">
        <div class="tuit-avatar" ng-style="{background: tuit.username | avatarColor}">
          {{ tuit.username | initials }}
        </div>
        <div class="flex-grow-1 overflow-hidden">
          <div class="d-flex align-items-center gap-2 mb-1 flex-wrap">
            <a href="" ng-click="openUsuario(tuit.username)" class="tuit-username">@{{ tuit.username }}</a>
            <span class="tuit-date">{{ tuit.fecha }}</span>
          </div>
          <div class="tuit-text">{{ tuit.texto }}</div>
          <div class="tuit-actions">
            <span class="btn-action"><i class="fas fa-reply"></i> <span>{{ tuit.num_respuestas }}</span></span>
            <button class="btn-action btn-rt" ng-class="{active: tuit.retuiteado}" ng-click="toggleRetuit(tuit)">
              <i class="fas fa-retweet"></i> <span>{{ tuit.num_retuits }}</span>
            </button>
            <button class="btn-action btn-like" ng-class="{active: tuit.liked}" ng-click="toggleLike(tuit)">
              <i class="fas fa-heart"></i> <span>{{ tuit.num_likes }}</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="tuit-card mb-3" ng-if="!loading">
      <div class="alert alert-danger py-2 mb-2" style="font-size:.85rem" ng-show="replyError">{{ replyError }}</div>
      <textarea class="form-control mb-1" rows="2" maxlength="300" style="resize:none"
                placeholder="Tu respuesta…" ng-model="replyTexto"></textarea>
      <div class="d-flex justify-content-end mt-2">
        <button class="btn-accent btn-sm" ng-click="submitReply()" ng-disabled="replying">
          <i class="fas fa-reply me-1"></i>Responder
        </button>
      </div>
    </div>

    <div class="replies-header" ng-if="!loading"><i class="fas fa-reply me-1"></i> Respuestas</div>
    <p class="text-center py-4" style="color:var(--text-muted)" ng-show="!loading && replies.length === 0">
      Sin respuestas todavía.
    </p>

    <div class="tuit-card" ng-repeat="r in replies">
      <div class="d-flex gap-3">
        <div class="tuit-avatar" ng-style="{background: r.username | avatarColor}">
          {{ r.username | initials }}
        </div>
        <div class="flex-grow-1 overflow-hidden">
          <div class="d-flex align-items-center gap-2 mb-1 flex-wrap">
            <a href="" ng-click="openUsuario(r.username)" class="tuit-username">@{{ r.username }}</a>
            <span class="tuit-date">{{ r.fecha }}</span>
          </div>
          <div class="tuit-text">{{ r.texto }}</div>
          <div class="tuit-actions">
            <button class="btn-action btn-rt" ng-class="{active: r.retuiteado}" ng-click="toggleRetuit(r)">
              <i class="fas fa-retweet"></i> <span>{{ r.num_retuits }}</span>
            </button>
            <button class="btn-action btn-like" ng-class="{active: r.liked}" ng-click="toggleLike(r)">
              <i class="fas fa-heart"></i> <span>{{ r.num_likes }}</span>
            </button>
            <button class="btn-action btn-delete" ng-show="isOwn(r)" ng-click="deleteReply(r)">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
