<div>
  <nav class="mt-navbar">
    <a href="#!/home" class="mt-navbar-brand"><i class="fas fa-dove"></i> MiniTwitter</a>
    <div class="nav-actions">
      <span class="nav-username">@{{ myUsername }}</span>
      <button class="btn-accent btn-sm" data-bs-toggle="modal" data-bs-target="#newTuitModal">
        <i class="fas fa-feather-alt"></i>
        <span class="d-none d-sm-inline ms-1">Nuevo tuit</span>
      </button>
      <button class="btn-ghost btn-sm" ng-click="logout()" title="Cerrar sesión">
        <i class="fas fa-right-from-bracket"></i>
      </button>
    </div>
  </nav>

  <div class="mt-feed">
    <div class="alert alert-danger" ng-show="errorMessage">{{ errorMessage }}</div>
    <div class="text-center py-5" ng-show="loading">
      <div class="spinner-border text-teal" role="status"></div>
    </div>
    <p class="text-center py-5" style="color:var(--text-muted)" ng-show="!loading && tuits.length === 0">
      No hay tuits todavía. ¡Sé el primero!
    </p>

    <div class="tuit-card" ng-repeat="tuit in tuits">
      <div class="d-flex gap-3">
        <div class="tuit-avatar" ng-style="{background: tuit.username | avatarColor}">
          {{ tuit.username | initials }}
        </div>
        <div class="flex-grow-1 overflow-hidden">
          <div class="d-flex align-items-center gap-2 mb-1 flex-wrap">
            <a href="" ng-click="openUsuario(tuit.username)" class="tuit-username">@{{ tuit.username }}</a>
            <span class="tuit-date">{{ tuit.fecha }}</span>
          </div>
          <div class="tuit-text clickable" ng-click="openTuit(tuit)">{{ tuit.texto }}</div>
          <div class="tuit-actions">
            <button class="btn-action btn-reply" ng-click="openTuit(tuit)" title="Responder">
              <i class="fas fa-reply"></i> <span>{{ tuit.num_respuestas }}</span>
            </button>
            <button class="btn-action btn-rt" ng-class="{active: tuit.retuiteado}"
                    ng-click="toggleRetuit(tuit)" title="Retuit">
              <i class="fas fa-retweet"></i> <span>{{ tuit.num_retuits }}</span>
            </button>
            <button class="btn-action btn-like" ng-class="{active: tuit.liked}"
                    ng-click="toggleLike(tuit)" title="Me gusta">
              <i class="fas fa-heart"></i> <span>{{ tuit.num_likes }}</span>
            </button>
            <button class="btn-action btn-delete" ng-show="isOwn(tuit)" ng-click="deleteTuit(tuit)" title="Eliminar">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="newTuitModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="fas fa-feather-alt text-teal me-2"></i>Nuevo tuit</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-danger py-2 mb-2" style="font-size:.85rem" ng-show="newError">{{ newError }}</div>
          <textarea class="form-control mb-1" rows="4" maxlength="300"
                    placeholder="¿Qué está pasando?" style="resize:none" ng-model="newTexto"></textarea>
          <div class="d-flex justify-content-end mb-2">
            <small class="char-counter">{{ newTexto.length || 0 }}/300</small>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-ghost btn-sm" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn-accent btn-sm" ng-click="submitNewTuit()" ng-disabled="posting">
            <i class="fas fa-paper-plane me-1"></i>Publicar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
